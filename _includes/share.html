{% assign share_url = page.url | absolute_url | url_encode %}
{% assign share_title = page.title | url_encode %}
<nav class="share{% if include.compact %} share--compact{% endif %}" aria-label="Share this post">
  {% unless include.compact %}<span class="share-label">Share</span>{% endunless %}
  <a class="share-btn" href="https://x.com/intent/post?text={{ share_title }}&amp;url={{ share_url }}" target="_blank" rel="noopener" title="Share on X">X</a>
  <a class="share-btn" href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url }}" target="_blank" rel="noopener" title="Share on LinkedIn">LinkedIn</a>
  <a class="share-btn" href="https://wa.me/?text={{ share_title }}%20{{ share_url }}" target="_blank" rel="noopener" title="Share on WhatsApp">WhatsApp</a>
  <a class="share-btn" href="https://www.reddit.com/submit?url={{ share_url }}&amp;title={{ share_title }}" target="_blank" rel="noopener" title="Share on Reddit">Reddit</a>
  <a class="share-btn" href="https://news.ycombinator.com/submitlink?u={{ share_url }}&amp;t={{ share_title }}" target="_blank" rel="noopener" title="Submit to Hacker News">HN</a>
  <a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u={{ share_url }}" target="_blank" rel="noopener" title="Share on Facebook">Facebook</a>
  <a class="share-btn" href="mailto:?subject={{ share_title }}&amp;body={{ share_url }}" title="Share by email">Email</a>
  <button type="button" class="share-btn copy-link" data-url="{{ page.url | absolute_url }}" title="Copy link">Copy link</button>
  <button type="button" class="share-btn native-share" hidden data-url="{{ page.url | absolute_url }}" data-title="{{ page.title | escape }}">Share…</button>
</nav>
