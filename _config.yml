exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - scripts

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      authors:
        - { given: "Siyanda", family: "Matika" }
        - { given: "Clemence", family: "Mungwariri" }
  - scope: { path: "_pages" }
    values: { layout: page }
